<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F7A4A" />
    <meta
      name="description"
      content="Central de Gestão: inventário de TI, quebra de máquinas e outros controles dos setores da empresa."
    />
    <title>Central de Gestão</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <!-- Tela de login (só aparece no modo compartilhado) -->
    <div class="auth" id="auth" hidden></div>

    <div class="app" id="app" hidden>
      <header class="top">
        <div class="titlebar">
          <h1 id="appTitle">Central de Gestão</h1>
          <p class="summary" id="summary">Carregando…</p>
          <button type="button" class="signout" id="signOut" hidden>Sair da conta</button>
        </div>
        <nav class="modules" id="modules" aria-label="Telas do app" hidden></nav>
        <div class="hdr" id="hdrTi">
          <nav class="tabs" id="tabs" aria-label="Seções do app">
            <button type="button" class="tab" data-tab="lista" aria-current="page">Lista</button>
            <button type="button" class="tab" data-tab="painel">Painel</button>
            <button type="button" class="tab" data-tab="importar">Importar</button>
          </nav>
          <div class="tools" id="tools" hidden>
            <div class="search">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="6.5" />
                <path d="M16 16l4.5 4.5" />
              </svg>
              <input
                id="q"
                type="search"
                placeholder="Buscar nome, série, responsável"
                aria-label="Buscar equipamento"
                autocomplete="off"
              />
            </div>
            <select id="catFilter" aria-label="Filtrar por categoria" hidden></select>
          </div>
          <div
            class="chips"
            id="catChips"
            role="group"
            aria-label="Filtrar por tipo de equipamento"
            hidden
          ></div>
          <div class="chips" id="chips" role="group" aria-label="Filtrar por status" hidden></div>
        </div>
        <div class="hdr" id="hdrQ" hidden>
          <nav class="tabs" id="tabsQ" aria-label="Seções de quebras">
            <button type="button" class="tab" data-qtab="registros" aria-current="page">Registros</button>
            <button type="button" class="tab" data-qtab="datas">Por data</button>
            <button type="button" class="tab" data-qtab="resumo">Resumo</button>
          </nav>
          <div class="tools tools2" id="toolsQ" hidden>
            <div class="search">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="6.5" />
                <path d="M16 16l4.5 4.5" />
              </svg>
              <input
                id="qSearch"
                type="search"
                placeholder="Buscar máquina"
                aria-label="Buscar registro"
                autocomplete="off"
              />
            </div>
          </div>
          <div class="chips" id="qPeriod" role="group" aria-label="Período" hidden></div>
          <div class="range" id="qRange" hidden>
            <div class="field"><label for="qFrom">De</label><input id="qFrom" type="date" /></div>
            <div class="field"><label for="qTo">Até</label><input id="qTo" type="date" /></div>
          </div>
          <div class="chips" id="qGroups" role="group" aria-label="Filtrar por grupo" hidden></div>
        </div>
      </header>

      <main>
        <div id="modTi">
          <div id="viewList">
            <div class="note" id="note" hidden>
              <span>Há equipamentos de exemplo salvos neste app.</span>
              <button type="button" class="link" data-act="rm-examples">Remover exemplos</button>
            </div>
            <ul class="list" id="list"></ul>
            <div class="empty" id="empty" hidden></div>
          </div>
          <div id="viewDash" hidden></div>
          <div id="viewImport" hidden></div>
        </div>
        <div id="modQ" hidden>
          <div id="qViewList">
            <ul class="list" id="qList"></ul>
            <div class="empty" id="qEmpty" hidden></div>
          </div>
          <div id="qViewDays" hidden></div>
          <div id="qViewSum" hidden></div>
        </div>
        <div id="modAccess" hidden></div>
        <p class="foot">
          <span id="foot"></span>
        </p>
      </main>

      <button class="fab" id="addBtn" type="button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Novo equipamento
      </button>
      <button class="fab" id="addQ" type="button" hidden>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Novo registro
      </button>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <form
      class="sheet"
      id="sheetForm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="formTitle"
      novalidate
      autocomplete="off"
      hidden
    >
      <div class="sheet-head">
        <div class="dh"><h2 id="formTitle">Novo equipamento</h2></div>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="f-name">Nome <span class="req">(obrigatório)</span></label>
          <input id="f-name" type="text" placeholder="Ex.: Notebook Dell Latitude 5420" />
        </div>
        <div class="two">
          <div class="field">
            <label for="f-cat">Categoria</label
            ><select id="f-cat"></select>
          </div>
          <div class="field">
            <label for="f-status">Status</label
            ><select id="f-status"></select>
          </div>
        </div>
        <div class="field">
          <label for="f-owner">Responsável</label>
          <input id="f-owner" type="text" list="dl-owners" placeholder="Quem usa este equipamento" />
          <datalist id="dl-owners"></datalist>
        </div>
        <details class="more" id="more">
          <summary>Mais detalhes</summary>
          <div class="inner">
            <div class="field">
              <label for="f-brand">Marca e modelo</label
              ><input id="f-brand" type="text" placeholder="Ex.: Dell Latitude 5420" />
            </div>
            <div class="two">
              <div class="field">
                <label for="f-serial">Número de série</label
                ><input id="f-serial" type="text" class="mono" placeholder="Ex.: 7K2M9Q3" />
              </div>
              <div class="field">
                <label for="f-tag">Patrimônio</label
                ><input id="f-tag" type="text" class="mono" placeholder="Ex.: PAT-0012" />
              </div>
            </div>
            <div class="field">
              <label for="f-loc">Local</label>
              <input id="f-loc" type="text" list="dl-locs" placeholder="Ex.: Financeiro, Almoxarifado" />
              <datalist id="dl-locs"></datalist>
            </div>
            <div class="two">
              <div class="field">
                <label for="f-buy">Data da compra</label><input id="f-buy" type="date" />
              </div>
              <div class="field">
                <label for="f-warranty">Garantia até</label><input id="f-warranty" type="date" />
              </div>
            </div>
            <div class="field">
              <label for="f-value">Valor pago (R$)</label
              ><input id="f-value" type="text" inputmode="decimal" placeholder="Ex.: 3.500,00" />
            </div>
            <div class="field">
              <label for="f-notes">Observações</label
              ><textarea
                id="f-notes"
                placeholder="Acessórios, defeitos conhecidos, onde está guardado."
              ></textarea>
            </div>
          </div>
        </details>
        <p class="err" id="formErr" role="alert"></p>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary" id="saveBtn">Salvar</button>
      </div>
    </form>

    <form
      class="sheet"
      id="sheetQ"
      role="dialog"
      aria-modal="true"
      aria-labelledby="qTitle"
      novalidate
      autocomplete="off"
      hidden
    >
      <div class="sheet-head">
        <div class="dh"><h2 id="qTitle">Novo registro</h2></div>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label for="q-day">Dia</label>
          <input id="q-day" type="date" />
        </div>
        <div class="field">
          <label for="q-machine">Máquina <span class="req">(obrigatório)</span></label>
          <input id="q-machine" type="text" list="dl-machines" placeholder="Ex.: RETA" />
          <datalist id="dl-machines"></datalist>
        </div>
        <div class="two">
          <div class="field">
            <label for="q-group">Grupo</label>
            <input id="q-group" type="text" list="dl-groups" placeholder="Ex.: G1" />
            <datalist id="dl-groups"></datalist>
          </div>
          <div class="field">
            <label for="q-parts">Peças perdidas</label>
            <input id="q-parts" type="text" inputmode="numeric" placeholder="Ex.: 22" />
          </div>
        </div>
        <div class="field">
          <label for="q-notes">Observações</label>
          <textarea id="q-notes" placeholder="O que aconteceu, quem avisou, o que foi trocado."></textarea>
        </div>
        <p class="err" id="qErr" role="alert"></p>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn danger" id="qDel" hidden>Excluir</button>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary" id="qSave">Salvar</button>
      </div>
    </form>

    <section
      class="sheet"
      id="sheetDetail"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      hidden
    >
      <div class="sheet-head">
        <div class="dh">
          <h2 id="detailTitle"></h2>
          <p id="detailSub" hidden></p>
        </div>
        <button type="button" class="icon-btn" id="detailClose" data-close aria-label="Fechar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="detailBody"></div>
      <div class="sheet-foot">
        <button type="button" class="btn danger" id="delBtn">Excluir</button>
        <button type="button" class="btn primary" id="editBtn">Editar</button>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
